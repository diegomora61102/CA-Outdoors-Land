name: Land and site data (monthly)
on:
  schedule:
    - cron: '41 10 3 * *'      # 3rd of each month at 10:41 UTC
  workflow_dispatch:
permissions:
  contents: write              # commits the rebuilt data; the site redeploys from the new commit
jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Download source layers
        run: python3 -I pipeline/sources.py raw
      - name: Build the map data
        run: python3 -I pipeline/build_data.py raw site/data
      # Photos are on hold: set the repository variable PHOTOS to 'on' (Settings -> Secrets and variables -> Actions -> Variables) to turn them on.
      - name: Install image tools
        if: ${{ vars.PHOTOS == 'on' }}
        run: pip install pillow==11.0.0
      - name: Photos and thumbnails (Forest Service pages; Recreation.gov once RIDB_API_KEY is set)
        if: ${{ vars.PHOTOS == 'on' }}
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
        run: python3 -I pipeline/photos.py
      - name: Rebuild with photos
        if: ${{ vars.PHOTOS == 'on' }}
        run: python3 -I pipeline/build_data.py raw site/data
      - name: Sync weather sites (new pins get an NWS grid cell)
        run: python3 -I pipeline/wx_sites.py --stations
      - name: Commit if anything changed
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/thumbs pipeline/state
          if git diff --cached --quiet; then echo "No changes this month."; else git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)" && git push; fi
